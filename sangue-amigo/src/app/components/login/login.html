<section class="login-wrap">
  <div class="login-card">
    <h1>Entrar</h1>
    <p class="sub">Conectando doadores, salvando vidas.</p>

    <div class="campo">
      <label class="label">CPF</label>
      <input class="input" type="text" [(ngModel)]="cpf" placeholder="000.000.000-00" />
    </div>

    <div class="campo">
      <label class="label">Senha</label>
      <input class="input" type="password" [(ngModel)]="senha" placeholder="••••••" />
    </div>

    @if (erro()) {
      <p class="msg-erro">{{ erro() }}</p>
    }

    <button class="btn-primary login-btn" (click)="entrar()">Entrar</button>

    <p class="cad-link">
      Ainda não tem conta? <a routerLink="/cadastro">Cadastre-se</a>
    </p>
  </div>
</section>
