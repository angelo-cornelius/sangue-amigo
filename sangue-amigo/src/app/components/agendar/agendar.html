<section class="container-narrow agendar">
  <h1>Agendar doação</h1>
  <p class="sub">Escolha o hemocentro e o horário desejado.</p>

  <div class="card">
    <div class="campo">
      <label class="label">Hemocentro</label>
      <select class="select" [(ngModel)]="hemocentroSelecionado">
        <option [ngValue]="null">Selecione...</option>
        @for (h of hemocentros(); track h.id) {
          <option [ngValue]="h.id">{{ h.nome }} — {{ h.cidade }}/{{ h.estado }}</option>
        }
      </select>
    </div>

    <div class="campo">
      <label class="label">Horário disponível</label>
      <div class="horarios">
        @for (h of horariosFixos; track h) {
          <button type="button" class="horario-btn" [class.ativo]="horario === h" (click)="horario = h">
            {{ h }}
          </button>
        }
      </div>
    </div>

    @if (erro()) { <p class="msg-erro">{{ erro() }}</p> }
    @if (sucesso()) { <p class="msg-sucesso">{{ sucesso() }}</p> }

    <button class="btn-primary confirmar" (click)="agendar()" [disabled]="enviando()">
      {{ enviando() ? 'Agendando...' : 'Confirmar agendamento' }}
    </button>
  </div>
</section>
