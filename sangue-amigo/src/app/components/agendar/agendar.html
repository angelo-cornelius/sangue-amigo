<section class="container-narrow agendar">
  <header class="agendar-head">
    <span class="eyebrow">Agendar</span>
    <h1>Vamos marcar sua doação.</h1>
    <p class="sub">Selecione o hemocentro e o horário que melhor cabem no seu dia.</p>
  </header>

  <form class="agendar-form" (ngSubmit)="agendar()" novalidate>

    <div class="campo">
      <label class="label" for="hemo">Hemocentro</label>
      <select id="hemo" class="select" [(ngModel)]="hemocentroSelecionado" name="hemo">
        <option [ngValue]="null">Selecione…</option>
        @for (h of hemocentros(); track h.id) {
          <option [ngValue]="h.id">{{ h.nome }} — {{ h.cidade }}/{{ h.estado }}</option>
        }
      </select>
    </div>

    <div class="campo">
      <label class="label">Horário disponível</label>
      <div class="horarios">
        @for (h of horariosFixos; track h) {
          <button type="button"
                  class="horario-btn"
                  [class.ativo]="horario === h"
                  (click)="horario = h">
            <app-icon name="clock" [size]="16"/>
            {{ h }}
          </button>
        }
      </div>
    </div>

    @if (erro()) { <p class="msg-erro" role="alert">{{ erro() }}</p> }
    @if (sucesso()) { <p class="msg-sucesso" role="status">{{ sucesso() }}</p> }

    <button class="btn-primary btn-lg btn-block" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Agendando…' : 'Confirmar agendamento' }}
    </button>
  </form>
</section>
