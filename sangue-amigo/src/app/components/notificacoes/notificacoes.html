<section class="container-narrow notif">
  <header class="notif-head">
    <span class="eyebrow">Inbox</span>
    <h1>Notificações</h1>
  </header>

  @if (notificacoes().length === 0) {
    <div class="vazio">
      <app-empty-anim variant="sino"/>
      <h3>Nada por aqui</h3>
      <p>Quando houver novidades, você verá nesta tela.</p>
    </div>
  } @else {
    <ul class="lista">
      @for (n of notificacoes(); track n.id) {
        <li class="item" [class.lida]="n.lida">
          <span class="icone" aria-hidden="true">
            <app-icon name="bell" [size]="18"/>
          </span>
          <div class="info">
            <p class="data">{{ n.data }}</p>
            <p class="titulo">{{ n.titulo }}</p>
          </div>
          @if (!n.lida) {
            <span class="dot" aria-hidden="true"></span>
            <span class="visually-hidden">Não lida</span>
          }
        </li>
      }
    </ul>
  }
</section>
